<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ElevenX — Local-first voice synthesis</title>
  <desc id="desc">A cinematic dark navy and electric violet product poster for ElevenX, featuring an abstract audio waveform and voiceprint rings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b18"/><stop offset=".55" stop-color="#11112b"/><stop offset="1" stop-color="#1b0b31"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#b56cff"/><stop offset="1" stop-color="#65e7ff"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".38"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1190" cy="390" r="330" fill="url(#glow)"/>
  <circle cx="1190" cy="390" r="210" fill="none" stroke="#a78bfa" stroke-opacity=".15" stroke-width="2"/>
  <circle cx="1190" cy="390" r="165" fill="none" stroke="#a78bfa" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="1190" cy="390" r="120" fill="none" stroke="#67e8f9" stroke-opacity=".32" stroke-width="2"/>
  <g fill="none" stroke="url(#violet)" stroke-linecap="round">
    <path d="M790 390 L820 390 L838 344 L856 438 L876 292 L897 484 L918 326 L940 420 L962 366 L984 390 L1004 390 L1025 330 L1045 455 L1065 284 L1085 487 L1105 321 L1125 430 L1145 350 L1165 390 L1185 390 L1205 315 L1225 465 L1245 300 L1265 450 L1285 350 L1305 390 L1325 390 L1345 365 L1365 416 L1385 390 L1415 390" stroke-width="5"/>
    <path d="M850 390 L868 370 L886 408 L904 355 L922 425 L940 370 L958 402 L976 390" stroke-width="2" opacity=".55"/>
  </g>
  <g fill="#c4b5fd" opacity=".8"><circle cx="1189" cy="390" r="5"/><circle cx="1294" cy="315" r="3"/><circle cx="1087" cy="465" r="3"/><circle cx="1344" cy="438" r="2"/></g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="110" y="130" fill="#a78bfa" font-size="24" font-weight="700" letter-spacing="8">NEXT-GENERATION VOICE TECHNOLOGY</text>
    <text x="100" y="310" fill="#ffffff" font-size="142" font-weight="800" letter-spacing="-7">Eleven<tspan fill="url(#violet)">X</tspan></text>
    <text x="112" y="380" fill="#e9d5ff" font-size="34" font-weight="500">Your voice. Your creative signature.</text>
    <text x="112" y="445" fill="#b7bdd5" font-size="23">LOCAL-FIRST SYNTHESIS  /  SPEAKER ANALYSIS  /  WAV EXPORT</text>
    <rect x="110" y="515" width="470" height="2" fill="url(#violet)" opacity=".9"/>
    <text x="112" y="570" fill="#ffffff" font-size="25" font-weight="700">BUILT FOR THE NEXT SOUND</text>
    <text x="112" y="615" fill="#9ca3bf" font-size="20">XTTS-v2 engine · optional ECAPA embeddings</text>
    <text x="112" y="650" fill="#9ca3bf" font-size="20">Designed to run locally after model setup</text>
    <rect x="112" y="710" width="220" height="52" rx="26" fill="#7c3aed"/>
    <text x="222" y="743" fill="#ffffff" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2">MEET ELEVENX</text>
    <text x="110" y="835" fill="#717a99" font-size="16" letter-spacing="3">PROTOTYPE MILESTONE · NOT A PERFORMANCE BENCHMARK</text>
    <text x="1490" y="835" fill="#717a99" text-anchor="end" font-size="16">ELEVENX / VOICE LAB</text>
  </g>
</svg>