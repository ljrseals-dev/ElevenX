# Optional offline drop-in TTS configuration. Defaults keep the path off.
codec:
  enabled: false
  require_validated_weights: true
  dropin:
    enabled: false
    default_codec: baseline # baseline | harmonia (reserved; readiness-gated)
    sample_rate: 22050

# Existing synthesis settings remain unchanged. XTTS-v2 stays the default.
synthesis:
  backend: xtts
