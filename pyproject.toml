[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elevenx"
version = "0.1.2"
description = "Local-first voice synthesis using XTTS-v2"
readme = "README.md"
# Python 3.8 remains a syntax-check target until XTTS distribution compatibility is verified.
requires-python = ">=3.9,<3.13"
dependencies = [
  "numpy>=1.21,<3",
  "PyYAML>=6.0",
  "soundfile>=0.12",
  "scipy>=1.8,<1.11; python_version < '3.12'",
  "scipy>=1.11; python_version >= '3.12'",
  "torch>=2.0,<2.5",
  "torchaudio>=2.0,<2.5",

  "fastapi>=0.100,<1",
  "uvicorn[standard]>=0.23,<1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
speaker = ["speechbrain>=1.0.0"]
test = ["pytest>=7,<9", "httpx>=0.24"]
dev = [
  "pytest>=7,<9",
  "httpx>=0.24",
  "ruff>=0.4",
  "black>=24",
  "mypy>=1.8",
]

[tool.black]
target-version = ["py38"]
line-length = 100

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.mypy]
python_version = "3.8"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elevenx = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
