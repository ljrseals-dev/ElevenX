name: ElevenX README and build pipeline

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme-and-build:
    name: README audit, tests, and package build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Check README links and required safety disclosures
        run: python scripts/check_readme.py

      - name: Install model-free test dependencies
        run: |
          python -m pip install "numpy>=1.26,<3" "PyYAML>=6.0" "soundfile>=0.12" "scipy>=1.11"
          python -m pip install "fastapi>=0.110" "uvicorn[standard]>=0.27" "python-multipart>=0.0.9" "httpx>=0.27" "pytest>=8.0"
          python -m pip install --no-deps -e .

      - name: Run test suite
        run: python -m pytest -q

      - name: Build source and wheel distributions
        run: python -m build

      - name: Verify distribution artifacts exist
        run: |
          python - <<'PY'
          from pathlib import Path
          artifacts = list(Path("dist").glob("*.whl")) + list(Path("dist").glob("*.tar.gz"))
          if len(artifacts) < 2:
              raise SystemExit(f"Expected wheel and source archive; found: {artifacts}")
          for artifact in artifacts:
              print(f"Built: {artifact} ({artifact.stat().st_size} bytes)")
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elevenx-python-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
