name: ElevenX model-free tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install documented project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run complete model-free suite
        run: python -m pytest -q
      - name: Verify vintage evidence harness self-check
        run: python -m elevenx.vintage_harness
