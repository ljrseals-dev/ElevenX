name: ElevenX model-free tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install model-free test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "PyYAML>=6.0" "soundfile>=0.12" "scipy>=1.11"
          python -m pip install "fastapi>=0.110" "uvicorn[standard]>=0.27" "python-multipart>=0.0.9" "httpx>=0.27" "pytest>=8.0"
          python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m pytest -q
